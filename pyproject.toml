[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-college-success"
version = "1.0.0"
description = "Chronological prediction of five-year NBA outcomes from college basketball data"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["research*"]
